name: Update profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Generate profile README
        run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "traktuner"
          git config user.email "78533119+traktuner@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update profile README"
          git push
